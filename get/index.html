<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaoHao — китайский язык</title>
<meta name="description" content="HaoHao: учите китайский 5 минут в день. HSK 1–2 и китайский для торговли.">
<style>
  :root { --bg: #FFF8EC; --ink: #2B1D16; --muted: #7A6658; --red: #C8102E; --gold: #B07A12; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17110F; --ink: #FFF3D9; --muted: #C9B8A6; --red: #FF6B7A; --gold: #F2B84B; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 420px; }
  .han { font-size: 64px; color: var(--red); font-weight: 700; margin: 0; }
  h1 { font-size: 40px; color: var(--red); margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; margin: 10px 0; padding: 14px 18px; border-radius: 16px; background: var(--red); color: #fff;
    text-decoration: none; font-weight: 700; }
  .soon { color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<main>
  <p class="han">好好</p>
  <h1>HaoHao</h1>
  <p>Китайский 5 минут в день · Xitoy tili kuniga 5 daqiqa · Қытай тили күнине 5 минут · Chinese in 5 minutes a day</p>
  <div id="links"></div>
</main>
<script>
  // Fill in once the app is live in each store.
  const APP_STORE = '';
  const GOOGLE_PLAY = '';
  const ua = navigator.userAgent;
  const target = /iPhone|iPad|iPod/.test(ua) ? APP_STORE : /Android/.test(ua) ? GOOGLE_PLAY : '';
  if (target) location.replace(target);
  const links = document.getElementById('links');
  for (const [name, url] of [['App Store', APP_STORE], ['Google Play', GOOGLE_PLAY]]) {
    if (!url) continue;
    const a = document.createElement('a');
    a.className = 'btn'; a.href = url; a.textContent = name;
    links.appendChild(a);
  }
  if (!links.children.length) {
    const p = document.createElement('p');
    p.className = 'soon'; p.textContent = 'Скоро в App Store · Coming soon';
    links.appendChild(p);
  }
</script>
</body>
</html>
